<main class="shell">
  <section class="hero">
    <p class="eyebrow">paciente</p>
    <h1>{{ title }}</h1>
    <p class="subtitle">Aplicacao Angular independente no repositorio VEREDAS-PWA.</p>
  </section>

  <section class="panel" *ngIf="loading()">Resolvendo contexto Edge/Web...</section>
  <section class="panel panel-error" *ngIf="error() as message">{{ message }}</section>

  <ng-container *ngIf="context() as current">
    <section class="panel source">
      <span class="badge" [class.edge]="current.source === 'edge'" [class.web]="current.source === 'web'">
        Origem: {{ current.source === 'edge' ? 'Edge' : 'Web fallback' }}
      </span>
      <p>{{ current.status }}</p>
      <p>{{ current.description }}</p>
    </section>

    <section class="panel">
      <h2>Acoes</h2>
      <div class="actions">
        <button type="button" *ngFor="let action of current.actions">{{ action }}</button>
      </div>
    </section>

    <section class="panel">
      <h2>Capacidades</h2>
      <div class="chips">
        <span *ngFor="let capability of current.capabilities">{{ capability }}</span>
      </div>
    </section>
  </ng-container>
</main>
